<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar URL Generator - 展示イベント用カレンダー登録URL生成</title>
    <meta name="description" content="写真展・個展の告知用Googleカレンダー登録URLを簡単生成。SNS投稿に最適化。">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nobphotographr.github.io/calendar-generator/">
    <meta property="og:title" content="Calendar URL Generator - 展示イベント用">
    <meta property="og:description" content="写真展・個展の告知用Googleカレンダー登録URLを簡単生成">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://nobphotographr.github.io/calendar-generator/">
    <meta property="twitter:title" content="Calendar URL Generator - 展示イベント用">
    <meta property="twitter:description" content="写真展・個展の告知用Googleカレンダー登録URLを簡単生成">

    <style>
        :root {
            --bg: #FFFFFF;
            --bg-subtle: #FAFAFA;
            --text: #111111;
            --text-muted: #666666;
            --border: #E5E5E5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0A0A0A;
                --bg-subtle: #141414;
                --text: #EDEDED;
                --text-muted: #888888;
                --border: #2A2A2A;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            padding: 96px 24px;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 64px;
        }

        .header h1 {
            font-size: 36px;
            line-height: 1.2;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .form-container {
            margin-bottom: 64px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-row {
            display: flex;
            gap: 24px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--text);
        }

        input::placeholder, textarea::placeholder {
            color: var(--text-muted);
        }

        textarea {
            resize: vertical;
            min-height: 96px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--text);
        }

        .checkbox-group label {
            margin-bottom: 0;
            font-weight: 400;
        }

        .generate-btn {
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        .generate-btn:hover {
            opacity: 0.8;
        }

        .result-container {
            margin-top: 48px;
            padding-top: 48px;
            border-top: 1px solid var(--border);
            display: none;
        }

        .result-container.show {
            display: block;
        }

        .result-item {
            margin-bottom: 16px;
        }

        .result-item h3 {
            color: var(--text);
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 500;
        }

        .url-display {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            padding: 16px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Mono', monospace;
            font-size: 14px;
            word-break: break-all;
            color: var(--text);
        }

        .copy-btn {
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            margin-top: 16px;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .copy-btn:hover {
            opacity: 0.8;
        }

        .copy-btn.copied {
            opacity: 0.6;
        }

        .footer {
            padding-top: 48px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            body {
                padding: 64px 16px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .header h1 {
                font-size: 24px;
            }

            .header {
                margin-bottom: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Calendar URL Generator</h1>
            <p>写真展・個展の告知用Googleカレンダー登録URLを生成</p>
        </header>

        <div class="form-container">
            <form id="calendarForm">
                <div class="form-group">
                    <label for="eventTitle">展示タイトル *</label>
                    <input type="text" id="eventTitle" name="eventTitle" required placeholder="例: 田中太郎写真展「東京の記憶」">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="startDate">開始日 *</label>
                        <input type="date" id="startDate" name="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">終了日 *</label>
                        <input type="date" id="endDate" name="endDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="isAllDay" name="isAllDay" checked>
                        <label for="isAllDay">終日イベント</label>
                    </div>
                </div>

                <div id="timeInputs" style="display: none;">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="startTime">開始時間</label>
                            <input type="time" id="startTime" name="startTime" value="10:00">
                        </div>
                        <div class="form-group">
                            <label for="endTime">終了時間</label>
                            <input type="time" id="endTime" name="endTime" value="18:00">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="venue">会場名 *</label>
                    <input type="text" id="venue" name="venue" required placeholder="例: 東京都写真美術館">
                </div>

                <div class="form-group">
                    <label for="address">住所</label>
                    <input type="text" id="address" name="address" placeholder="例: 東京都目黒区三田1-13-3 恵比寿ガーデンプレイス内">
                </div>

                <div class="form-group">
                    <label for="description">詳細・メモ</label>
                    <textarea id="description" name="description" placeholder="例: 入場料：無料&#10;展示時間：10:00-18:00 (最終日17:00まで)&#10;休館日：月曜日"></textarea>
                </div>

                <div class="form-group">
                    <label for="announceUrl">告知URL</label>
                    <input type="url" id="announceUrl" name="announceUrl" placeholder="例: https://example.com/exhibition">
                </div>

                <button type="submit" class="generate-btn">カレンダーURL生成</button>
            </form>

            <div id="resultContainer" class="result-container">
                <div class="result-item">
                    <h3>Googleカレンダー登録URL</h3>
                    <div class="url-display" id="shortUrl">短縮URL生成中...</div>
                    <button class="copy-btn" onclick="copyToClipboard('shortUrl', this)">URLをコピー</button>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>データはブラウザ上でのみ処理され、サーバーには保存されません</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const nextWeek = new Date(today);
            nextWeek.setDate(nextWeek.getDate() + 7);

            document.getElementById('startDate').value = today.toISOString().split('T')[0];
            document.getElementById('endDate').value = nextWeek.toISOString().split('T')[0];

            document.getElementById('isAllDay').addEventListener('change', function() {
                const timeInputs = document.getElementById('timeInputs');
                timeInputs.style.display = this.checked ? 'none' : 'block';
            });
        });

        document.getElementById('calendarForm').addEventListener('submit', function(e) {
            e.preventDefault();
            generateCalendarUrl();
        });

        function generateCalendarUrl() {
            const formData = new FormData(document.getElementById('calendarForm'));
            const data = Object.fromEntries(formData);

            const startDate = new Date(data.startDate);
            const endDate = new Date(data.endDate);

            if (endDate < startDate) {
                alert('終了日は開始日以降に設定してください');
                return;
            }

            let googleUrl;

            if (data.isAllDay === 'on') {
                const startDateStr = data.startDate.replace(/-/g, '');
                const endDateObj = new Date(endDate);
                endDateObj.setDate(endDateObj.getDate() + 1);
                const endDateStr = endDateObj.toISOString().split('T')[0].replace(/-/g, '');

                googleUrl = createGoogleCalendarUrl({
                    title: data.eventTitle,
                    startDate: startDateStr,
                    endDate: endDateStr,
                    isAllDay: true,
                    venue: data.venue,
                    address: data.address || '',
                    description: data.description || '',
                    announceUrl: data.announceUrl || ''
                });
            } else {
                const startDateTime = new Date(data.startDate + 'T' + data.startTime);
                const endDateTime = new Date(data.endDate + 'T' + data.endTime);

                const startUTC = new Date(startDateTime.getTime() - (9 * 60 * 60 * 1000));
                const endUTC = new Date(endDateTime.getTime() - (9 * 60 * 60 * 1000));

                const startDateTimeStr = startUTC.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
                const endDateTimeStr = endUTC.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');

                googleUrl = createGoogleCalendarUrl({
                    title: data.eventTitle,
                    startDate: startDateTimeStr,
                    endDate: endDateTimeStr,
                    isAllDay: false,
                    venue: data.venue,
                    address: data.address || '',
                    description: data.description || '',
                    announceUrl: data.announceUrl || ''
                });
            }

            displayResults(googleUrl);
        }

        function createGoogleCalendarUrl(eventData) {
            const location = eventData.address || eventData.venue;

            let details = '';
            if (eventData.venue && eventData.address) {
                details += `会場: ${eventData.venue}\n`;
            }
            if (eventData.description) {
                details += `\n${eventData.description}\n`;
            }
            if (eventData.announceUrl) {
                details += `\n詳細情報: ${eventData.announceUrl}`;
            }

            const params = new URLSearchParams({
                action: 'TEMPLATE',
                text: eventData.title,
                dates: `${eventData.startDate}/${eventData.endDate}`,
                details: details,
                location: location
            });

            return `https://calendar.google.com/calendar/render?${params.toString()}`;
        }

        function displayResults(googleUrl) {
            shortenUrl(googleUrl);
            document.getElementById('resultContainer').classList.add('show');
            document.getElementById('resultContainer').scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        }

        async function shortenUrl(longUrl) {
            const shortUrlElement = document.getElementById('shortUrl');

            try {
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);

                if (response.ok) {
                    const shortUrl = await response.text();

                    if (shortUrl.startsWith('https://tinyurl.com/')) {
                        shortUrlElement.textContent = shortUrl;
                    } else {
                        throw new Error('Invalid response from TinyURL');
                    }
                } else {
                    throw new Error('TinyURL request failed');
                }
            } catch (error) {
                console.error('URL shortening failed:', error);
                shortUrlElement.textContent = '短縮URL生成に失敗しました';
            }
        }

        function copyToClipboard(elementId, button) {
            const element = document.getElementById(elementId);
            const text = element.textContent || element.innerHTML;

            navigator.clipboard.writeText(text).then(function() {
                const originalText = button.textContent;
                button.textContent = 'コピーしました';
                button.classList.add('copied');

                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 2000);
            }).catch(function(err) {
                console.error('コピーに失敗:', err);
                const range = document.createRange();
                range.selectNode(element);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                window.getSelection().removeAllRanges();

                button.textContent = 'コピーしました';
                setTimeout(() => {
                    button.textContent = 'URLをコピー';
                }, 2000);
            });
        }
    </script>
</body>
</html>
